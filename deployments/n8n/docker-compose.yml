# n8n 自托管 (Community Edition, Fair Code, 自托管免费)
# 起停: docker compose -f deployments/n8n/docker-compose.yml up -d
# UI:  http://localhost:5678
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: "http://localhost:5678/"
      GENERIC_TIMEZONE: "Asia/Shanghai"
      N8N_RUNNERS_ENABLED: "true"
      # 本地 http 访问需关闭 secure cookie,否则浏览器登录被拦
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
