# Postiz 自托管 (Apache 2.0, 自托管无月费)
# 起停: docker compose -f deployments/postiz/docker-compose.yml up -d
# UI:  http://localhost:5000  (首个注册号自动成 admin,建号后把 DISABLE_REGISTRATION 改 true 重启)
services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz
    restart: unless-stopped
    environment:
      MAIN_URL: "http://localhost:5000"
      FRONTEND_URL: "http://localhost:5000"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:5000/api"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in deployments/postiz/.env}"
      DATABASE_URL: "postgresql://postiz:postiz@postiz-postgres:5432/postiz"
      REDIS_URL: "redis://postiz-redis:6379"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: "false"
      # 新版 Postiz 后端依赖 Temporal 工作流引擎
      TEMPORAL_ADDRESS: "temporal:7233"
    ports:
      - "5000:5000"
    depends_on:
      - postiz-postgres
      - postiz-redis
      - temporal
    volumes:
      - postiz-config:/config
      - postiz-uploads:/uploads

  # Temporal:复用 postiz-postgres 做主存储,visibility 走 elasticsearch
  # (Postiz 要注册 >3 个 Text 搜索属性,postgres visibility 上限 3 个会让后端崩,必须用 ES)
  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: temporal
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: postiz
      POSTGRES_PWD: postiz
      POSTGRES_SEEDS: postiz-postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility_v2
      ENABLE_ES: "true"
      ES_SEEDS: temporal-elasticsearch
      ES_VERSION: v7
      SKIP_DEFAULT_NAMESPACE_CREATION: "false"
    ports:
      - "7233:7233"
    depends_on:
      - postiz-postgres
      - temporal-elasticsearch

  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    container_name: temporal-elasticsearch
    restart: unless-stopped
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    volumes:
      - temporal-es:/usr/share/elasticsearch/data

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: postiz
      POSTGRES_DB: postiz
    volumes:
      - postiz-pg:/var/lib/postgresql/data

  postiz-redis:
    image: redis:7.2-alpine
    container_name: postiz-redis
    restart: unless-stopped
    volumes:
      - postiz-redis:/data

volumes:
  postiz-pg:
  postiz-redis:
  postiz-config:
  postiz-uploads:
  temporal-es:
